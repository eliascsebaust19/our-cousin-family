<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · Our Cousin Family</title>
  <meta name="theme-color" content="#1d6a4c" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fbf7f0;
      color: #1d2b22;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e7ddcd;
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(29, 43, 34, 0.06);
    }
    .icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: #f0e9dd;
      color: #1d6a4c;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    .icon-wrap svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #1d2b22;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #6d7a70;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #1d6a4c;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
      width: 100%;
    }
    .btn:hover {
      background-color: #16523a;
    }
    .badge {
      display: inline-block;
      margin-top: 18px;
      font-size: 12px;
      color: #c96f4a;
      background: #faece5;
      padding: 4px 12px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>Please check your internet connection. Our Cousin Family will reconnect as soon as network is restored.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div>
      <span class="badge">Offline Protection Active</span>
    </div>
  </div>
</body>
</html>
