name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    name: Typecheck, Lint, DB Verification, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify migrations, RLS & DB security (PGlite)
        run: npm run db:check

      - name: Run unit test suite (Vitest)
        run: npm run test

      - name: Build Next.js application
        run: npm run build

