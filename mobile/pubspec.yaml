name: our_cousin_family
description: A private family social network for cousins and extended family members.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.1.0

  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Supabase
  supabase_flutter: ^2.3.4

  # Authentication
  google_sign_in: ^6.2.1

  # Storage & Preferences
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # UI Components
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0
  photo_view: ^0.15.0
  flutter_staggered_animations: ^1.1.1
  flutter_animate: ^4.3.0

  # Media
  image_picker: ^1.0.7
  video_player: ^2.8.2
  audioplayers: ^5.2.1
  record: ^5.0.4

  # Camera & Media Processing
  image: ^4.1.7

  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.0.9

  # Utilities
  uuid: ^4.2.2
  path_provider: ^2.1.2
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  permission_handler: ^11.2.0
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^17.0.0
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.15

  # Audio/Video Calls
  flutter_webrtc: ^0.10.6

  # Games
  flame: ^1.14.0

  # Charts & Visualization
  fl_chart: ^0.66.2

  # Encryption & Security
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Google Drive
  googleapis: ^13.1.0
  googleapis_auth: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  mocktail: ^1.0.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800